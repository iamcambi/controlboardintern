<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport lock prevents pinch-to-zoom and double-tap zoom on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Board | Directives</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'board-black': '#050505',
                        'board-dark': '#111111',
                        'hiss-red': '#ff003c',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050505;
            color: #f0f0f0;
            overflow: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
            /* Extra mobile touch improvements */
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(5,5,5,0.9) 100%);
            z-index: 10;
            pointer-events: none;
        }

        .pyramid-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            opacity: 0.15;
            animation: float 10s ease-in-out infinite;
        }

        .pyramid {
            width: 40vw; /* Slightly larger on mobile */
            height: 40vw;
            max-width: 400px;
            max-height: 400px;
            fill: #000;
            stroke: #fff;
            stroke-width: 2;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.2));
            transition: all 0.5s ease;
        }

        @media (min-width: 768px) {
            .pyramid { width: 30vw; height: 30vw; }
        }

        .pyramid.hiss-active {
            stroke: #ff003c;
            filter: drop-shadow(0 0 30px #ff003c);
        }

        @keyframes float {
            0% { transform: translate(-50%, -48%); }
            50% { transform: translate(-50%, -52%);
