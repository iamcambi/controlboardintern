<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Board | Directives</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'board-black': '#050505',
                        'board-dark': '#111111',
                        'hiss-red': '#ff003c',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050505;
            color: #f0f0f0;
            overflow: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        /* CRT Scanline Effect */
        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 50;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* Subtle vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(5,5,5,0.9) 100%);
            z-index: 10;
            pointer-events: none;
        }

        .pyramid-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            opacity: 0.15;
            animation: float 10s ease-in-out infinite;
        }

        .pyramid {
            width: 30vw;
            height: 30vw;
            max-width: 400px;
            max-height: 400px;
            fill: #000;
            stroke: #fff;
            stroke-width: 2;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.2));
            transition: all 0.5s ease;
        }

        .pyramid.hiss-active {
            stroke: #ff003c;
            filter: drop-shadow(0 0 30px #ff003c);
        }

        @keyframes float {
            0% { transform: translate(-50%, -48%); }
            50% { transform: translate(-50%, -52%); }
            100% { transform: translate(-50%, -48%); }
        }

        .glitch-wrapper {
            position: relative;
        }

        .glitch {
            position: relative;
            display: inline-block;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        .glitch::before {
            left: 2px;
            text-shadow: -2px 0 #ff003c;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim 5s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: -2px;
            text-shadow: -2px 0 #00ffff;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim2 5s infinite linear alternate-reverse;
        }

        .glitch.active-glitch::before {
            animation: glitch-anim-fast 0.3s infinite linear alternate-reverse;
        }

        .glitch.active-glitch::after {
            animation: glitch-anim2-fast 0.3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 86px, 0); }
            5% { clip: rect(61px, 9999px, 12px, 0); }
            10% { clip: rect(10px, 9999px, 56px, 0); }
            15% { clip: rect(80px, 9999px, 10px, 0); }
            20% { clip: rect(30px, 9999px, 90px, 0); }
            25% { clip: rect(20px, 9999px, 40px, 0); }
            100% { clip: rect(20px, 9999px, 40px, 0); }
        }

        @keyframes glitch-anim2 {
            0% { clip: rect(40px, 9999px, 20px, 0); }
            5% { clip: rect(80px, 9999px, 90px, 0); }
            10% { clip: rect(30px, 9999px, 10px, 0); }
            15% { clip: rect(10px, 9999px, 56px, 0); }
            20% { clip: rect(61px, 9999px, 12px, 0); }
            25% { clip: rect(10px, 9999px, 86px, 0); }
            100% { clip: rect(10px, 9999px, 86px, 0); }
        }

        .btn-brutal {
            position: relative;
            background: transparent;
            color: #fff;
            border: 3px solid #fff;
            font-weight: 900;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            overflow: hidden;
            transition: all 0.3s ease;
            z-index: 20;
        }

        .btn-brutal::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #fff;
            transition: all 0.3s ease;
            z-index: -1;
        }

        .btn-brutal:hover {
            color: #050505;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .btn-brutal:hover::before {
            left: 0;
        }

        .btn-action {
            background: transparent;
            color: #aaa;
            border: 1px solid #aaa;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-action:hover {
            color: #fff;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .slash {
            color: #ff003c;
            font-weight: 900;
        }
    </style>
</head>
<body class="crt h-screen w-screen flex flex-col items-center justify-center relative">
    
    <div class="vignette"></div>

    <!-- Inverted Pyramid Background -->
    <div class="pyramid-container">
        <svg class="pyramid" id="pyramid-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
            <polygon points="0,0 100,0 50,100" />
        </svg>
    </div>

    <!-- Main Content -->
    <main class="z-20 flex flex-col items-center justify-center w-full px-6 max-w-5xl h-full space-y-12">
        
        <!-- Header -->
        <div class="text-xs md:text-sm tracking-[0.3em] text-gray-500 uppercase font-bold text-center">
            Federal Bureau of Control <br>
            <span class="text-hiss-red">Astral Plane Translator</span>
        </div>

        <!-- The Directive Display -->
        <div class="min-h-[150px] md:min-h-[200px] flex flex-col items-center justify-center w-full text-center">
            <h1 class="text-2xl md:text-4xl lg:text-5xl font-black uppercase tracking-wider leading-tight glitch-wrapper drop-shadow-lg">
                <span class="glitch" id="directive-text" data-text="< AWAITING INPUT / THOUGHT >">
                    &lt; AWAITING INPUT <span class="slash">/</span> THOUGHT &gt;
                </span>
            </h1>
            
            <!-- Action Toolbar -->
            <div id="action-toolbar" class="flex flex-wrap justify-center gap-4 mt-6 opacity-0 pointer-events-none transition-opacity duration-500 min-h-10">
                <button id="copy-btn" class="btn-action">COPY TEXT</button>
                <button id="share-img-btn" class="btn-action">SAVE IMAGE</button>
            </div>
        </div>

        <!-- Input Area -->
        <div class="w-full max-w-2xl flex flex-col sm:flex-row gap-4 relative z-30">
            <input type="text" id="user-input" autocomplete="off"
                class="flex-grow bg-[#111] border-2 border-gray-600 p-4 text-white text-sm md:text-lg focus:outline-none focus:border-white font-bold tracking-wider placeholder-gray-600 transition-colors shadow-2xl" 
                placeholder="ENTER QUERY / THOUGHT...">
            <button id="transmit-btn" class="btn-brutal px-8 py-4 text-sm md:text-lg cursor-pointer flex items-center justify-center whitespace-nowrap disabled:opacity-50 disabled:cursor-not-allowed">
                TRANSMIT <span class="mx-2 text-hiss-red font-black">/</span> SEND
            </button>
        </div>
    </main>

    <!-- Export Modal Overlay -->
    <div id="export-modal" class="fixed inset-0 z-[100] hidden bg-black/90 flex-col items-center justify-center p-4 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="text-white text-center mb-6 tracking-[0.2em] font-bold text-sm md:text-base drop-shadow-md">
            RIGHT-CLICK OR LONG-PRESS TO SAVE IMAGE
        </div>
        <img id="export-image" class="w-full max-w-[400px] aspect-square object-contain border-4 border-white shadow-[0_0_40px_rgba(255,255,255,0.15)] pointer-events-auto" src="" alt="Transmitted Directive">
        <button id="close-modal-btn" class="btn-brutal px-8 py-3 mt-8 text-sm md:text-base cursor-pointer">
            CLOSE <span class="mx-2 text-hiss-red font-black">/</span> DISMISS
        </button>
    </div>

    <script>
        const userInput = document.getElementById('user-input');
        const transmitBtn = document.getElementById('transmit-btn');
        const directiveText = document.getElementById('directive-text');
        const pyramidSvg = document.getElementById('pyramid-svg');
        const actionToolbar = document.getElementById('action-toolbar');
        const copyBtn = document.getElementById('copy-btn');
        const shareImgBtn = document.getElementById('share-img-btn');
        const exportModal = document.getElementById('export-modal');
        const exportImage = document.getElementById('export-image');
        const closeModalBtn = document.getElementById('close-modal-btn');

        let isTransmitting = false;
        let currentRawText = "";
        let formattedHtmlText = "";

        // API Call to Gemini
        async function translateToBoard(text) {
            const systemPrompt = "You are 'The Board' from the video game Control. You communicate telepathically with the Director in short, authoritative, eerie, and bureaucratic sentences. Your signature trait is the heavy use of forward slashes to separate synonyms, related concepts, hidden meanings, or contradictions (e.g., 'Welcome/Intruder', 'The House/World shifts', 'You/Director must cleanse/destroy'). Capitalize important nouns. Translate the user's input into your specific, unsettling speech pattern. Keep the response concise, typically one or two sentences. Do NOT wrap your response in < or > tags, just output the raw text.";
            
            const payload = {
                contents: [{ parts: [{ text: text }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
            };

            try {
                // Route the request to your secure Netlify backend function
                const response = await fetch('/.netlify/functions/board', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                if (result.candidates && result.candidates[0].content.parts[0].text) {
                    return result.candidates[0].content.parts[0].text.trim();
                } else {
                    throw new Error("Invalid API response format");
                }
            } catch (error) {
                console.error("Astral Plane Connection Failed:", error);
                return "CONNECTION LOST / STATIC / INTERFERENCE";
            }
        }

        function formatBoardOutput(plainText) {
            let cleaned = plainText.replace(/^</, '').replace(/>$/, '').trim();
            // Create UI HTML with standard slash formatting
            let uiHtml = cleaned.replace(/\//g, '<span class="slash">/</span>');
            
            // Create export HTML (inline styles needed for html2canvas reliability)
            let exportHtml = cleaned.replace(/\//g, '<span style="color: #ff003c;">/</span>');
            
            return {
                ui: `&lt; ${uiHtml} &gt;`,
                export: `&lt; ${exportHtml} &gt;`,
                raw: `< ${cleaned} >`
            };
        }

        async function handleTransmission() {
            const text = userInput.value.trim();
            if (!text || isTransmitting) return;

            isTransmitting = true;
            transmitBtn.disabled = true;
            userInput.disabled = true;
            actionToolbar.classList.add('opacity-0', 'pointer-events-none');
            
            // Visual feedback
            pyramidSvg.classList.add('hiss-active');
            directiveText.classList.add('active-glitch');
            
            const connectingText = "TRANSMITTING / CONNECTING";
            directiveText.innerHTML = `&lt; ${connectingText.replace(/\//g, "<span class='slash'>/</span>")} &gt;`;
            directiveText.setAttribute('data-text', `< ${connectingText} >`);

            const translatedText = await translateToBoard(text);
            const formats = formatBoardOutput(translatedText);
            
            currentRawText = formats.raw;
            formattedHtmlText = formats.export;

            // Strip HTML for the glitch shadow
            let rawTextForData = currentRawText.replace(/<span[^>]*>/g, '').replace(/<\/span>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>'); 

            directiveText.innerHTML = formats.ui;
            directiveText.setAttribute('data-text', rawTextForData);
            
            setTimeout(() => {
                directiveText.classList.remove('active-glitch');
                pyramidSvg.classList.remove('hiss-active');
                actionToolbar.classList.remove('opacity-0', 'pointer-events-none');
                
                isTransmitting = false;
                transmitBtn.disabled = false;
                userInput.disabled = false;
                userInput.value = '';
                userInput.focus();
            }, 600);
        }

        transmitBtn.addEventListener('click', handleTransmission);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleTransmission();
        });

        copyBtn.addEventListener('click', () => {
            if (!currentRawText) return;
            const textArea = document.createElement("textarea");
            textArea.value = currentRawText;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "COPIED / CAPTURED";
                copyBtn.style.color = "#ff003c";
                copyBtn.style.borderColor = "#ff003c";
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                    copyBtn.style.color = "";
                    copyBtn.style.borderColor = "";
                }, 2000);
            } catch (err) {
                console.error('Failed to copy', err);
            }
            textArea.remove();
        });

        shareImgBtn.addEventListener('click', async () => {
            if (!currentRawText) return;
            
            const originalText = shareImgBtn.innerText;
            shareImgBtn.innerText = "PROCESSING...";
            shareImgBtn.disabled = true;

            const customAlert = (msg) => {
                const toast = document.createElement('div');
                toast.style.position = 'fixed';
                toast.style.bottom = '20px';
                toast.style.left = '50%';
                toast.style.transform = 'translateX(-50%)';
                toast.style.background = '#ff003c';
                toast.style.color = '#fff';
                toast.style.padding = '1rem 2rem';
                toast.style.fontWeight = 'bold';
                toast.style.zIndex = '99999';
                toast.style.border = '2px solid #fff';
                toast.innerText = msg;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 5000);
            };

            // Dynamically created export node reference
            let exportNode = null;

            try {
                // 1. Dynamically create the 1080x1080 export container
                exportNode = document.createElement('div');
                exportNode.style.cssText = 'position: absolute; top: 0; left: -9999px; width: 1080px; height: 1080px; background-color: #050505; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: -9999;';
                
                exportNode.innerHTML = `
                    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; pointer-events: none; z-index: 5;"></div>
                    <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; width: 600px; height: 600px; fill: #000; stroke: #fff; stroke-width: 2; opacity: 0.15; top: 50%; left: 50%; transform: translate(-50%, -50%);">
                        <polygon points="0,0 100,0 50,100" />
                    </svg>
                    <div style="position: relative; z-index: 10; width: 80%; text-align: center;">
                        <h1 style="color: #f0f0f0; font-family: 'Inter', sans-serif; font-size: 72px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.2;">
                            ${formattedHtmlText}
                        </h1>
                    </div>
                    <div style="position: absolute; bottom: 40px; color: #555; font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; z-index: 10;">
                        FBC <span style="color: #ff003c;">/</span> ASTRAL TRANSLATION
                    </div>
                `;

                // Explicitly append to DOM before capturing
                document.body.appendChild(exportNode);

                // Wait a moment for the DOM structure and fonts to settle
                await new Promise(resolve => setTimeout(resolve, 200));

                // 2. Capture the explicitly appended DOM node
                const canvas = await html2canvas(exportNode, {
                    width: 1080,
                    height: 1080,
                    scale: 2,
                    backgroundColor: '#050505',
                    useCORS: true,
                    allowTaint: true
                }).catch(err => {
                    throw new Error('Export Error: ' + err);
                });

                // 3. Extract Data URL
                const dataUrl = canvas.toDataURL('image/png');
                
                // 4. Display in Modal instead of forcing download
                exportImage.src = dataUrl;
                exportModal.classList.remove('hidden');
                exportModal.classList.add('flex');
                
                // Trigger reflow for fade-in
                void exportModal.offsetWidth;
                exportModal.classList.remove('opacity-0');

                document.body.removeChild(exportNode);
                resetShareBtn();

            } catch (error) {
                console.error("Image generation failed:", error);
                shareImgBtn.innerText = "ERROR / FAILURE";
                shareImgBtn.style.color = "#ff003c";
                customAlert(error.message || 'Export Error occurred');
                
                // Cleanup in case of failure
                if (exportNode && document.body.contains(exportNode)) {
                    document.body.removeChild(exportNode);
                }
                
                setTimeout(resetShareBtn, 2000);
            }

            function resetShareBtn() {
                shareImgBtn.innerText = "SAVE IMAGE";
                shareImgBtn.disabled = false;
                shareImgBtn.style.color = "";
            }
        });

        // Close Modal Logic
        closeModalBtn.addEventListener('click', () => {
            exportModal.classList.add('opacity-0');
            setTimeout(() => {
                exportModal.classList.add('hidden');
                exportModal.classList.remove('flex');
                exportImage.src = "";
            }, 300);
        });
    </script>
</body>
</html>
